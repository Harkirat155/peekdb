[package]
name = "mcp-db-readonly"
version = "0.1.0"
edition = "2021"
description = "MCP server that enforces read-only database access — safe AI-assisted DB exploration"
license = "MIT"
repository = "https://github.com/Harkirat155/mcp-db-readonly"
readme = "README.md"
keywords = ["mcp", "database", "postgresql", "mongodb", "readonly"]
categories = ["database", "command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
toml = "0.8"
mongodb = { version = "2.8", features = ["tokio-runtime"] }
futures = "0.3"
time = { version = "0.3", features = ["formatting"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[features]
default = ["tls"]
tls = ["dep:postgres-native-tls", "dep:native-tls", "redis/tokio-native-tls-comp"]
